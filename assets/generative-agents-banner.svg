<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
<title id="title">Generative Agents — Interactive Simulacra of Human Behavior</title>
<desc id="desc">A stylized evening town with connected AI memory nodes, representing autonomous agents, memory, planning, and interaction.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#11172f"/><stop offset=".55" stop-color="#24204d"/><stop offset="1" stop-color="#102d46"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9b5cf6" stop-opacity=".72"/><stop offset="1" stop-color="#38d6e8" stop-opacity=".28"/>
  </linearGradient>
  <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe7a3"/><stop offset="1" stop-color="#f6a85c"/>
  </linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="neon"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1500" height="500" fill="url(#bg)"/>
